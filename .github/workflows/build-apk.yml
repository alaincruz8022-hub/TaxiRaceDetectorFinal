name: Build TaxiRaceDetector APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify ZIP exists
        run: |
          if [ ! -f "TaxiRaceDetector_desde_cero_v2.zip" ]; then
            echo "ERROR: No se encontró TaxiRaceDetector_desde_cero_v2.zip en la raíz del repositorio."
            echo "Archivos disponibles:"
            ls -la
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          unzip -o TaxiRaceDetector_desde_cero_v2.zip -d extracted

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find extracted -type f -name settings.gradle -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find extracted -type f -name settings.gradle.kts -print -quit | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No se encontró settings.gradle ni settings.gradle.kts."
            echo "Contenido extraído:"
            find extracted -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto encontrado en: $PROJECT_DIR"

      - name: Verify project files
        run: |
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          if [ ! -f "$PROJECT_DIR/build.gradle" ] && [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "ERROR: Falta el archivo de configuración Gradle del proyecto."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: Falta la configuración Gradle de la aplicación."
            exit 1
          fi

          echo "Estructura básica del proyecto verificada."

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            echo "ERROR: El proyecto no incluye gradlew."
            echo "No se usará una versión de Gradle elegida al azar."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TaxiRaceDetector-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
